[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-data-platform"
version = "0.1.0"
description = "Personal data ingestion and analytics platform"
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.40,<2",
  "ccl-segb @ https://github.com/cclgroupltd/ccl-segb/archive/23c3f7d3d969a79627b738ba0a2486c31d675753.tar.gz",
  "duckdb>=1.3,<2",
]

[project.scripts]
pdp = "personal_data_platform.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
