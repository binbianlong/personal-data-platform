personal_data_platform:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '../var/personal-data-platform.duckdb') }}"
      schema: main
      threads: 4
    prod:
      type: duckdb
      path: "md:{{ env_var('MOTHERDUCK_DATABASE') }}?motherduck_token={{ env_var('DBT_ENV_SECRET_MOTHERDUCK_TOKEN') }}"
      schema: main
      threads: 4
