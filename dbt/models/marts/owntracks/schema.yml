version: 2

models:
  - name: owntracks_location_time_series
    description: Observed OwnTracks locations; gaps are not interpolated.
    config:
      tags: [owntracks]
    columns:
      - name: event_key
        data_tests: [unique, not_null]
      - name: event_at
        data_tests: [not_null]
      - name: latitude
        data_tests: [not_null]
      - name: longitude
        data_tests: [not_null]
