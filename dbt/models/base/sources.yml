      description: 睡眠セッションの識別子。NULL不可。
    - name: start_at
      description: 提供元の睡眠開始時刻。タイムゾーン付きの絶対時刻。NULL不可。
    - name: end_at
      description: 提供元の睡眠終了時刻。タイムゾーン付きの絶対時刻。NULL不可。
