      description: 提供元の起床後分数。NULLは不明・未取得・未算出。
    - name: offset_seconds
      description: 開始時刻に付属する提供元のUTCオフセット秒。NULLは不明・未取得・未算出。
    - name: end_offset_seconds
      description: 終了時刻に付属する提供元のUTCオフセット秒。NULLは不明・未取得・未算出。
