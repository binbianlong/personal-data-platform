version: 2

models:
  - name: screen_time_transition
    description: One current, decoded iPhone foreground transition per logical event.
    columns:
      - name: event_key
        data_tests: [unique, not_null]
      - name: device_key
        data_tests: [not_null]
      - name: bundle_id
        data_tests: [not_null]
      - name: event_at
        data_tests: [not_null]
      - name: state
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [start, end]

  - name: screen_time_interval
    description: Deterministically paired and quality-labelled foreground intervals.
    columns:
      - name: interval_key
        data_tests: [unique, not_null]
      - name: quality
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [complete, inferred_end_from_next_start, missing_end, missing_start]

  - name: daily_screen_time
    description: Screen Time per Asia/Tokyo date, device, platform and application.
    columns:
      - name: activity_date
        data_tests: [not_null]
      - name: device_key
        data_tests: [not_null]
      - name: platform
        data_tests: [not_null]
      - name: bundle_id
        data_tests: [not_null]
      - name: complete_seconds
        data_tests: [not_null]
      - name: inferred_seconds
        data_tests: [not_null]
      - name: total_seconds
        data_tests: [not_null]
      - name: complete_interval_parts
        data_tests: [not_null]
      - name: inferred_interval_parts
        data_tests: [not_null]

  - name: daily_screen_time_total
    description: Sum of application usage per Asia/Tokyo date, device and platform, including inferred time.
    columns:
      - name: activity_date
        data_tests: [not_null]
      - name: device_key
        data_tests: [not_null]
      - name: platform
        data_tests: [not_null]
      - name: complete_seconds
        data_tests: [not_null]
      - name: inferred_seconds
        data_tests: [not_null]
      - name: total_seconds
        data_tests: [not_null]
      - name: complete_interval_parts
        data_tests: [not_null]
      - name: inferred_interval_parts
        data_tests: [not_null]

  - name: fitbit_heart_rate_minute_time_series
    description: Complete observed UTC minutes from Google wearable rollups. Missing or nonwear minutes are absent; API sample_count is unknown.
    columns:
      - name: start_at
        data_tests: [not_null]
      - name: mean_minute_heart_rate
        description: Provider mean within this minute, independent of unknown original sample count.
        data_tests: [not_null]

  - name: daily_fitbit_heart_rate_minute
    description: Heart rate per Asia/Tokyo date. Each observed minute has equal weight; this is not an average weighted by original samples.
    columns:
      - name: mean_minute_heart_rate
        description: Arithmetic mean of the observed minute means.
        data_tests: [not_null]
      - name: observed_heart_rate_minutes
        description: Count of minutes with heart rate values; missing and nonwear windows are excluded.
        data_tests: [not_null]
