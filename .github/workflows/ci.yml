name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Install development dependencies
        run: just sync

      - name: Lint
        run: just lint

      - name: Check formatting
        run: just format-check

      - name: Type check
        run: just typecheck

      - name: Test
        run: just test -q

      - name: Build package
        run: just build

  container:
    name: Container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --tag personal-data-platform:ci .

      - name: Run entrypoint smoke tests
        run: |
          # Help paths validate the shared container entrypoint without requiring
          # local Biome data or production credentials.
          docker run --rm personal-data-platform:ci --help
          docker run --rm personal-data-platform:ci screen-time --help
          docker run --rm personal-data-platform:ci loader --help
          docker run --rm personal-data-platform:ci dbt --help
          docker run --rm personal-data-platform:ci reconciliation --help
          docker run --rm personal-data-platform:ci preflight --help
          docker run --rm personal-data-platform:ci fitbit --help
          docker run --rm personal-data-platform:ci fitbit serve --help
          docker run --rm personal-data-platform:ci fitbit serve-worker --help
          docker run --rm personal-data-platform:ci fitbit sync --help
          docker run --rm personal-data-platform:ci owntracks serve --help
          docker run --rm personal-data-platform:ci owntracks serve-worker --help
          docker run --rm --entrypoint python personal-data-platform:ci -c 'import personal_data_platform.sources.fitbit.runtime'
          docker run --rm --entrypoint python personal-data-platform:ci -c '
          from personal_data_platform.dbt_runner import DBT_PROJECT_DIR
          assert (DBT_PROJECT_DIR / "dbt_project.yml").is_file()
          assert (DBT_PROJECT_DIR / "profiles.yml").is_file()
          assert list((DBT_PROJECT_DIR / "models").rglob("*.sql"))
          '

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Validate Terraform roots
        run: |
          for root in infra/bootstrap infra/github infra/terraform infra/motherduck; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
            terraform -chdir="$root" test
          done

  required:
    name: CI
    if: ${{ always() }}
    needs:
      - python
      - container
      - terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      PYTHON_RESULT: ${{ needs.python.result }}
      CONTAINER_RESULT: ${{ needs.container.result }}
      TERRAFORM_RESULT: ${{ needs.terraform.result }}
    steps:
      - name: Require every check to pass
        run: |
          test "$PYTHON_RESULT" = "success"
          test "$CONTAINER_RESULT" = "success"
          test "$TERRAFORM_RESULT" = "success"
