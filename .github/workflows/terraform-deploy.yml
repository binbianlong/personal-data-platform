name: Terraform Deploy

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "dbt/**"
      - "infra/terraform/**"
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/terraform-deploy.yml"
  workflow_dispatch:
    inputs:
      run_daily:
        description: Run combined daily processing after deployment
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Runtime deploy
    if: ${{ vars.GCP_DEPLOY_WIF_PROVIDER != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      IMAGE_NAME: ${{ vars.GCP_IMAGE_NAME }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_alert_email: ${{ vars.GCP_ALERT_EMAIL }}
      TF_VAR_collector_impersonator_member: ${{ vars.GCP_COLLECTOR_IMPERSONATOR_MEMBER }}
      TF_VAR_deployer_service_account_email: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      TF_VAR_fitbit_subject_key: ${{ vars.PDP_FITBIT_SUBJECT_KEY }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      WEST_REGION: us-west1
      WEST_ARTIFACT_REPOSITORY: ${{ vars.GCP_WEST_ARTIFACT_REPOSITORY || vars.GCP_ARTIFACT_REPOSITORY }}
      TF_VAR_west_region: us-west1
      TF_VAR_west_schedulers_enabled: ${{ vars.PDP_WEST_SCHEDULERS_ENABLED || 'true' }}
      TF_VAR_west_logging_exclusions: ${{ vars.PDP_WEST_LOGGING_EXCLUSIONS || '{}' }}
      TF_VAR_west_image_uri: ${{ vars.GCP_WEST_RUNTIME_IMAGE_URI }}
      TF_VAR_west_secret_versions: ${{ vars.PDP_WEST_SECRET_VERSIONS || '{}' }}
      TF_VAR_west_motherduck_database: ${{ vars.PDP_WEST_MOTHERDUCK_DATABASE || 'personal_data_platform_west' }}
      TF_VAR_west_preflight_motherduck_database: ${{ vars.PDP_WEST_PREFLIGHT_MOTHERDUCK_DATABASE || 'personal_data_platform_west_preflight' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate repository variables
        shell: bash
        run: |
          set -euo pipefail
          for name in WEST_ARTIFACT_REPOSITORY GCP_PROJECT_ID WEST_REGION IMAGE_NAME TF_STATE_BUCKET TF_VAR_alert_email TF_VAR_collector_impersonator_member TF_VAR_deployer_service_account_email; do
            test -n "${!name}"
          done
          jq -e '
            type == "object" and
            (["fitbit_oauth_config", "fitbit_webhook_config", "heartbeat_config", "motherduck_token"] - keys | length == 0) and
            (keys - ["fitbit_oauth_config", "fitbit_webhook_config", "heartbeat_config", "motherduck_preflight_token", "motherduck_token"] | length == 0) and
            all(.[]; type == "string" and test("^[1-9][0-9]*\\z"))
          ' <<< "${TF_VAR_west_secret_versions}" > /dev/null || {
            echo "Deployment requires four runtime numeric secret version pins in PDP_WEST_SECRET_VERSIONS." >&2
            exit 1
          }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Prepare west runtime image
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          WEST_ROLLBACK_IMAGE_URI: ${{ vars.GCP_WEST_ROLLBACK_IMAGE_URI }}
        run: |
          set -euo pipefail
          image_path="${WEST_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${WEST_ARTIFACT_REPOSITORY}/${IMAGE_NAME}"
          jobs="$(gcloud run jobs list --project="${GCP_PROJECT_ID}" --region="${WEST_REGION}" \
            --filter='metadata.labels.application=personal-data-platform' --format=json)"
          revisions="$(gcloud run revisions list --project="${GCP_PROJECT_ID}" --region="${WEST_REGION}" --format=json)"
          current_images="$(jq -r '.[] | [.metadata.name, .spec.template.spec.template.spec.containers[0].image] | @tsv' <<< "${jobs}")"
          while IFS=$'\t' read -r job image; do
            [[ -n "${job}" ]] || continue
            [[ "${image}" == "${image_path}@"* && "${image}" =~ @sha256:[0-9a-f]{64}$ ]] || exit 1
            gcloud artifacts docker tags add "${image}" "${image_path}:deployed-job-${job}" --quiet
          done <<< "${current_images}"
          current_revisions="$(jq -r '.[] | [.metadata.name, (.status.imageDigest // .spec.containers[0].image)] | @tsv' <<< "${revisions}")"
          while IFS=$'\t' read -r revision image; do
            [[ -n "${revision}" ]] || continue
            [[ "${image}" == "${image_path}@"* && "${image}" =~ @sha256:[0-9a-f]{64}$ ]] || exit 1
            gcloud artifacts docker tags add "${image}" "${image_path}:deployed-revision-${revision}" --quiet
          done <<< "${current_revisions}"
          if [[ -n "${WEST_ROLLBACK_IMAGE_URI}" ]]; then
            [[ "${WEST_ROLLBACK_IMAGE_URI}" == "${image_path}@"* && "${WEST_ROLLBACK_IMAGE_URI}" =~ @sha256:[0-9a-f]{64}$ ]] || exit 1
            gcloud artifacts docker tags add "${WEST_ROLLBACK_IMAGE_URI}" "${image_path}:deployed-rollback" --quiet
          fi
          current_image="$(jq -r '.[] | select(.metadata.name == "reconciliation-west") | .spec.template.spec.template.spec.containers[0].image' <<< "${jobs}")"
          build=true
          if [[ "${GITHUB_EVENT_NAME}" == "push" && -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            changed="$(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" -- Dockerfile .dockerignore pyproject.toml src/ dbt/)"
            if [[ -z "${changed}" && -n "${current_image}" ]]; then build=false; fi
          fi
          if [[ "${build}" == "true" ]]; then
            gcloud auth configure-docker "${WEST_REGION}-docker.pkg.dev" --quiet
            docker build --tag "${image_path}:${GITHUB_SHA}" .
            docker push "${image_path}:${GITHUB_SHA}"
            digest="$(gcloud artifacts docker images describe "${image_path}:${GITHUB_SHA}" --format='value(image_summary.digest)')"
            current_image="${image_path}@${digest}"
          fi
          [[ "${current_image}" == "${image_path}@"* && "${current_image}" =~ @sha256:[0-9a-f]{64}$ ]] || exit 1
          gcloud artifacts docker tags add "${current_image}" "${image_path}:deployed-candidate" --quiet
          echo "TF_VAR_west_image_uri=${current_image}" >> "${GITHUB_ENV}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize runtime state
        run: terraform -chdir=infra/terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -input=false -lockfile=readonly

      - name: Validate runtime configuration
        run: terraform -chdir=infra/terraform validate

      - name: Plan runtime changes
        run: terraform -chdir=infra/terraform plan -input=false -out=runtime.tfplan

      - name: Apply runtime changes
        run: terraform -chdir=infra/terraform apply -input=false -auto-approve runtime.tfplan

      - name: Run combined daily job
        if: ${{ inputs.run_daily }}
        run: gcloud run jobs execute reconciliation-west --project="${GCP_PROJECT_ID}" --region="${WEST_REGION}" --wait
